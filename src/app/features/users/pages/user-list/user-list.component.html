<div class="users-container">
  <div class="header">
    <h2>Gestión de Usuarios</h2>
  </div>

  <div *ngIf="loading" class="loading-spinner">Cargando usuarios...</div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div *ngIf="!loading && !error && users.length === 0" class="empty-state">
    <p>No hay usuarios registrados en la plataforma.</p>
  </div>

  <table *ngIf="!loading && users.length > 0" class="users-table">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Correo Electrónico</th>
        <th>Rol Actual</th>
        <th>Cambiar Rol</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users">
        <td>{{ user.name }}</td>
        <td>{{ user.email }}</td>
        <td>
          <span class="badge role-{{ user.role }}">{{ user.role }}</span>
        </td>
        <td>
          <select 
            [ngModel]="user.role" 
            (ngModelChange)="onRoleChange(user, $event)"
            [disabled]="updatingUserId === user.id">
            <option value="client">Cliente</option>
            <option value="agent">Agente</option>
            <option value="admin">Administrador</option>
          </select>
        </td>
      </tr>
    </tbody>
  </table>
</div>
