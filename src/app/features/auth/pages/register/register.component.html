<div class="auth-container">
  <div class="auth-card">
    <h2>Crear Cuenta</h2>
    <p class="subtitle">Regístrate como cliente</p>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Nombre completo</label>
        <input type="text" formControlName="name" placeholder="Tu nombre" />
        <small *ngIf="registerForm.get('name')?.invalid && registerForm.get('name')?.touched">
          Mínimo 3 caracteres
        </small>
      </div>

      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" formControlName="email" placeholder="tu@email.com" />
        <small *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
          Ingresa un correo válido
        </small>
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" formControlName="password" placeholder="••••••" />
        <small *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
          Mínimo 6 caracteres
        </small>
      </div>

      <div class="success" *ngIf="successMessage">{{ successMessage }}</div>
      <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button type="submit" [disabled]="loading || registerForm.invalid">
        {{ loading ? 'Creando...' : 'Registrarme' }}
      </button>
    </form>

    <p class="link">¿Ya tienes cuenta? <a routerLink="/auth/login">Inicia sesión</a></p>
  </div>
</div>
