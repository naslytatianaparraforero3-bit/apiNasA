<nav class="navbar" *ngIf="authService.isLoggedIn()">
  <div class="nav-brand">Helpdesk System</div>
  
  <div class="nav-links">
    <a routerLink="/tickets" routerLinkActive="active">Tickets</a>
    
    <a *ngIf="authService.getUserRole() === 'admin'" 
       routerLink="/users" 
       routerLinkActive="active">
      Gestión de Usuarios
    </a>
  </div>

  <div class="nav-user">
    <span>{{ authService.getUserName() }} ({{ authService.getUserRole() }})</span>
    <button class="btn-logout" (click)="authService.logout()">Cerrar Sesión</button>
  </div>
</nav>

<router-outlet></router-outlet>
